name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Market Pulse: refresh prices and headlines every 6 hours (fresh data is built into the deployed site).
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh Market Pulse data (keeps the last good data for any source that fails)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 4
        run: npm run pulse
      - run: npm test
      - run: npm run build
      - name: Smoke-test CLI
        run: node bin/value-memo.js --sector hospitality --scenario "Margin discipline" --summary
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
