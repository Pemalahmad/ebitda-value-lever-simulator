name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Market Pulse: refresh prices and headlines every 6 hours (fresh data is built into the deployed site).
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high
      - name: Refresh Market Pulse data (keeps the last good data for any source that fails)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 4
        run: npm run pulse
      - run: npm test
      - name: Lint agent skills
        run: npm run lint:skills
      - run: npm run build
      - name: Smoke-test CLI
        run: node bin/value-memo.js --sector hospitality --scenario "Margin discipline" --summary
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
